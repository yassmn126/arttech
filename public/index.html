<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>genesis — музыкальный дневник воспоминаний</title>
  <!-- Three.js from CDN (pinned). 3D is imported dynamically, so the app still works offline with a flat disc. -->
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.61.6/+esm"
  } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- UI: Manrope (sleek, Cyrillic), Prata (serif wordmark + titles, Cyrillic), Caveat (handwriting).
       Memory card + stickers (canvas): Fraunces, Caveat, JetBrains Mono, Nunito. -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;700;800;900&family=Prata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23c9c3ff'/><stop offset='.5' stop-color='%2389b4ff'/><stop offset='1' stop-color='%23f2a6d6'/></linearGradient></defs><circle cx='16' cy='16' r='14' fill='%2311132a' stroke='url(%23g)' stroke-width='2'/><circle cx='16' cy='16' r='9' fill='none' stroke='url(%23g)' stroke-width='5' opacity='.7'/><circle cx='16' cy='16' r='2.5' fill='%23fff'/></svg>">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="sparkle" viewBox="0 0 24 24"><path d="M12 1c.9 6.1 4 9.6 11 11-7 1.4-10.1 4.9-11 11-.9-6.1-4-9.6-11-11 7-1.4 10.1-4.9 11-11z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <!-- atmospheric backdrop: mood-tinted glows + the day's photo, softly blurred (colours come from home.js setMood) -->
  <div class="ambient" aria-hidden="true">
    <i class="photo"></i><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
    <i class="beam b1"></i><i class="beam b2"></i><i class="stars"></i><i class="grain"></i><i class="vignette"></i>
    <svg class="sp p1"><use href="#sparkle"/></svg><svg class="sp p2"><use href="#sparkle"/></svg><svg class="sp p3"><use href="#sparkle"/></svg><svg class="sp p4"><use href="#sparkle"/></svg>
  </div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="genesis — на главную">
      <span class="logo">genesis</span><svg class="spark" aria-hidden="true"><use href="#sparkle"/></svg>
      <span class="tagline">музыкальный дневник воспоминаний</span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <div class="seg">
        <a href="#/" data-nav="home" class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>Главная <b class="nav-count"></b></a>
        <a href="#/stats" data-nav="stats" class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="12" width="3.4" height="8" rx="1.5" fill="currentColor"/><rect x="10.3" y="7" width="3.4" height="13" rx="1.5" fill="currentColor"/><rect x="16.6" y="3" width="3.4" height="17" rx="1.5" fill="currentColor"/></svg>Статистика</a>
        <button type="button" class="pill capsule" data-capsule title="Случайный день из архива — сразу с музыкой"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M17.5 3.5v3.7h-3.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Капсула времени</button>
      </div>
      <a href="#/new" data-nav="new" class="pill pink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.8 5 3.2 7.6 8.5 8.5-5.3.9-7.7 3.5-8.5 8.5-.8-5-3.2-7.6-8.5-8.5 5.3-.9 7.7-3.5 8.5-8.5z" fill="currentColor"/></svg>Новый день</a>
    </nav>
  </header>
  <main id="view"></main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
